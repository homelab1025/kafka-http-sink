#Fri Feb 13 19:13:52 UTC 2026
micronaut.application.name=kafkahttpsink
micronaut.metrics.export.prometheus.enabled=true
micronaut.metrics.enabled=true
micronaut.metrics.export.prometheus.step=PT1M
micronaut.metrics.export.prometheus.descriptions=true

# Kafka Consumer Configuration
kafka.bootstrap.servers=localhost:9092
kafka.sink.consumer.enabled=true
kafka.sink.consumer.group-id=kafka-http-sink
kafka.sink.consumer.topic=messages

# Storage Configuration (memory, rocksdb, or foundationdb)
kafka.sink.storage.type=memory
kafka.sink.storage.rocksdb.path=/tmp/kafka-sink-db
kafka.sink.storage.foundationdb.api-version=730
kafka.sink.storage.foundationdb.cluster-file=
kafka.sink.storage.foundationdb.directory=kafka-sink-messages

# Delivery Configuration
kafka.sink.delivery.guaranteed=false

# Batching Configuration
kafka.sink.batching.enabled=false
kafka.sink.batching.size=100
kafka.sink.batching.timeout-ms=5000

# Retry Configuration
kafka.sink.retry.max-attempts=3
kafka.sink.retry.delay-ms=1000

# Pusher Configuration
kafka.sink.pusher.enabled=true
kafka.sink.pusher.poll-interval=1s
kafka.sink.pusher.http.url=http://localhost:8081/messages
